name: Build installer

# Builds the Larch OS installer ISO inside the privileged Docker builder and
# publishes it as a GitHub Release. The ISO carries no system files: it boots
# the system's kernel with installer.initramfs (drivers, firmware, tools), and the
# installer downloads the system release and desktop the user picks
# (build-system.yml).
#
# The installer is built from the system rootfs (kernel, drivers, firmware,
# tools), so its base is built first (system stages 1-4; no desktops).
#
#   - Push an installer tag (installer-v*) → build + create a Release with the ISO
#   - Run manually (workflow_dispatch)     → build + upload it as a workflow artifact

on:
  push:
    tags: ['installer-v*']
  workflow_dispatch:

permissions:
  contents: write          # required to create Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build installer ISO (privileged Docker)
        run: |
          ./docker-build.sh system --to 4
          ./docker-build.sh installer

      - name: Prepare artifacts
        run: |
          sudo chown "$USER" output/larch-installer.iso
          cd output
          sha256sum larch-installer.iso > larch-installer.iso.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: larch-installer-iso
          path: |
            output/larch-installer.iso
            output/larch-installer.iso.sha256

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # the installer is what new users start from: always "Latest"
          make_latest: 'true'
          files: |
            output/larch-installer.iso
            output/larch-installer.iso.sha256
