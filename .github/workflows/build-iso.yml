name: Build ISO

# Builds larch-os.iso inside the privileged Docker builder (the same
# ./docker-build.sh used locally) and publishes it as a GitHub Release asset.
#
#   - Push a version tag (v*)      → build + create a Release with the ISO
#                                    and the root squashfs
#   - Run manually (workflow_dispatch) → build + upload them as a workflow
#                                        artifact only (no Release)
#
# The squashfs (work/rootfs.squashfs, the exact image the ISO carries and the
# installer writes raw onto LARCHSYS) is published as larch-os-rootfs.squashfs
# so an installed system can fetch it for an in-place update without the ISO.
#
# The build needs privileged Docker (chroot / mount --bind / mknod); GitHub
# hosted ubuntu-latest runners support this.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write          # required to create Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ISO (privileged Docker)
        # No disk-cleanup step for now. Instead, log free space on / every 30s
        # for the whole build so that if a heavy stage (debootstrap, mksquashfs,
        # initramfs packing, or the ISO build) runs the runner out of space, the
        # drop is visible in the log right before the failure. work/ and the
        # Docker data both live on /, so that's the filesystem that fills up.
        run: |
          ( while true; do
              printf '[disk %s] ' "$(date -u +%H:%M:%S)"
              df -h / | awk 'NR==2 {print $4" avail ("$5" used of "$2")"}'
              sleep 30
            done ) &
          df_logger=$!
          trap 'kill "$df_logger" 2>/dev/null || true' EXIT
          echo "[disk] baseline before build:"; df -h /
          ./docker-build.sh        # docker build + docker run --privileged

      - name: Prepare artifacts
        # output/ and work/ are written by the privileged container as root.
        # work/ is discarded after this job, so move the squashfs instead of
        # copying ~1 GiB.
        run: |
          sudo mv work/rootfs.squashfs output/larch-os-rootfs.squashfs
          sudo chown "$USER" output/larch-os.iso output/larch-os-rootfs.squashfs
          cd output
          sha256sum larch-os.iso > larch-os.iso.sha256
          sha256sum larch-os-rootfs.squashfs > larch-os-rootfs.squashfs.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: larch-os-iso
          path: |
            output/larch-os.iso
            output/larch-os.iso.sha256
            output/larch-os-rootfs.squashfs
            output/larch-os-rootfs.squashfs.sha256

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/larch-os.iso
            output/larch-os.iso.sha256
            output/larch-os-rootfs.squashfs
            output/larch-os-rootfs.squashfs.sha256
