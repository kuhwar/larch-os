name: Build system

# Builds the Larch OS system release inside the privileged Docker builder (the
# same ./docker-build.sh used locally) and publishes its files as a GitHub
# Release — what the installer ISO and the "Update LARCH" boot entry download
# (shared/lib/release.sh):
#
#   sys-<desktop>.squashfs (one per system/desktops/<desktop>)
#   vmlinuz  sys.initramfs  updater.initramfs  BOOTX64.EFI  loader.tar  SHA256SUMS
#
# Every desktop is built in this one job from one base rootfs, so all images
# carry modules for the one kernel the release ships. The installer and the
# updater list each image as larch-<desktop>-<tag>.
#
#   - Push a version tag (v*)          → build + create a Release with them
#   - Run manually (workflow_dispatch) → build + upload them as a workflow
#                                        artifact only (no Release)
#
# The installer ISO is released separately (build-installer.yml, tags
# installer-v*); the installer and updater only consider releases that carry
# the kernel, both initramfs, the bootloader, its entries, SHA256SUMS and at
# least one image.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write          # required to create Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build system (privileged Docker)
        # Log free space on / every 30s, so that if a heavy stage (bootstrap,
        # mksquashfs, initramfs packing) runs the runner out of space, the drop
        # is visible right before the failure.
        env:
          LARCH_VERSION: ${{ github.ref_name }}
        run: |
          ( while true; do
              printf '[disk %s] ' "$(date -u +%H:%M:%S)"
              df -h / | awk 'NR==2 {print $4" avail ("$5" used of "$2")"}'
              sleep 30
            done ) &
          df_logger=$!
          trap 'kill "$df_logger" 2>/dev/null || true' EXIT
          echo "[disk] baseline before build:"; df -h /
          ./docker-build.sh system

      - name: Prepare artifacts
        # output/ is written by the privileged container as root.
        run: sudo chown -R "$USER" output/system

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: larch-os-system
          path: output/system/*

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          # never take "Latest" from the installer release
          make_latest: 'false'
          files: output/system/*
