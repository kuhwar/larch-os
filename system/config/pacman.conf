# pacman.conf of the larch OS build rootfs (stage 2 writes it with @MIRROR@
# replaced: the Arch Linux Archive snapshot of config/arch-snapshot, or
# $LARCH_ARCH_MIRROR). Used only while building — the image has no pacman.

[options]
Architecture = x86_64
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 5
# Docs are deleted before squashfs anyway (remove-files.list); skipping them
# here keeps the base and every desktop copy smaller and faster to rsync.
NoExtract = usr/share/doc/* usr/share/man/* usr/share/info/* usr/share/gtk-doc/*

[core]
Server = @MIRROR@/$repo/os/$arch

[extra]
Server = @MIRROR@/$repo/os/$arch
