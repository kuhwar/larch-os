# Tuning for swap on zram (see /etc/systemd/zram-generator.conf), as Fedora
# and Pop!_OS ship it. Swapping to RAM is cheap, so prefer it over dropping the
# page cache, and don't read ahead: neighbouring pages gain nothing from it.
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0
