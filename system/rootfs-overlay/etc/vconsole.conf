# The default keyboard layout: US. /etc is read-only, so the image keeps this
# file as the default of LARCHCONF:/etc/vconsole.conf (shared/lib/conf.sh
# ETC_LINKS), where localed writes the layout chosen in GNOME Settings (login
# screen). XKBLAYOUT is what localed and the login screen read; KEYMAP the
# console's (no text consoles ship, but systemd-vconsole-setup still reads it).
KEYMAP=us
XKBLAYOUT=us
