# nslcd.conf — larch-os (ldap-poc): accounts from the local slapd
# (larch-slapd.service). Replaces nss-pam-ldapd's example. No secrets: nslcd
# reads anonymously; users bind with their own password through pam_ldap.
uid nslcd
gid ldap
uri ldapi://%2Frun%2Fopenldap%2Fldapi
base dc=larch
base passwd ou=people,dc=larch
base group  ou=groups,dc=larch

# The display name is cn (UTF-8); gecos is IA5 (ASCII only).
map passwd gecos cn

# Never ask the directory about the image's system users (boot, GDM, …), and
# only serve people's accounts.
nss_initgroups_ignoreusers ALLLOCAL
nss_min_uid 1000
