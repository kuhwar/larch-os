# slapd.conf — larch-os's local account directory (ldap-poc)
# Static, from the image: run by larch-slapd.service with -f (Fedora's
# cn=config tree in slapd.d/ is not used, so nothing here drifts in /etc).
# Listens only on the local socket /run/openldap/ldapi; the database is on
# LARCHCONF at /conf/ldap (created by the installer; Reset leaves it alone).

include     /etc/openldap/schema/core.schema
include     /etc/openldap/schema/cosine.schema
include     /etc/openldap/schema/inetorgperson.schema
include     /etc/openldap/schema/nis.schema

pidfile     /run/openldap/slapd.pid
argsfile    /run/openldap/slapd.args
loglevel    none

# Passwords set through the server (passwd → pam_ldap → password-modify) are
# hashed by the system's crypt(3) as yescrypt, like /etc/shadow's.
password-hash               {CRYPT}
password-crypt-salt-format  "$y$j9T$%.16s"

database    mdb
suffix      "dc=larch"
directory   /conf/ldap
maxsize     67108864
# root = any process running as root on the socket (SASL EXTERNAL).
rootdn      "gidNumber=0+uidNumber=0,cn=peercred,cn=external,cn=auth"

index objectClass eq
index uid,uidNumber,gidNumber,memberUid eq

# Hashes: only binds may use them, and a user may change their own.
access to attrs=userPassword
    by self write
    by anonymous auth
    by * none
access to attrs=shadowLastChange
    by self write
    by * read
# Everything else is as public as /etc/passwd and /etc/group.
access to *
    by * read
