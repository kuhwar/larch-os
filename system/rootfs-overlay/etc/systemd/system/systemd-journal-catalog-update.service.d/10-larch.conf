# /var is the read-only image, so /var/.updated is always the image's and
# ConditionNeedsUpdate=/var never holds. Rebuild the catalog (journalctl -x's
# explanations, /var/lib/systemd/catalog/database on LARCHCONF) after an
# update — like /etc's ConditionNeedsUpdate= services — or when it's missing
# (a fresh install or a reset: LARCHCONF's /var/lib hides the image's copy).
[Unit]
ConditionNeedsUpdate=
ConditionNeedsUpdate=|/etc
ConditionPathExists=|!/var/lib/systemd/catalog/database
