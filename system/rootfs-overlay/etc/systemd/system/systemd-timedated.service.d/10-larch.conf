# /etc is read-only: /etc/localtime and /etc/adjtime are links to LARCHCONF,
# and timedated replaces files by rename, so it writes there directly.
# With a path of its own, timedated writes an absolute link
# (/usr/share/zoneinfo/<zone>).
[Service]
Environment=SYSTEMD_ETC_LOCALTIME=/conf/etc/localtime SYSTEMD_ETC_ADJTIME=/conf/etc/adjtime
ReadWritePaths=/conf
