# /etc is read-only: /etc/locale.conf and /etc/vconsole.conf are links to
# LARCHCONF, and localed replaces files by rename, so it writes there
# directly. Its X11 keyboard file's directory, /etc/X11/xorg.conf.d, is bound
# from LARCHCONF (fstab).
[Service]
Environment=SYSTEMD_ETC_LOCALE_CONF=/conf/etc/locale.conf SYSTEMD_ETC_VCONSOLE_CONF=/conf/etc/vconsole.conf
ReadWritePaths=/conf
