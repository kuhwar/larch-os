# The only swap on larch-os: a zstd-compressed block device in RAM, created at
# boot by systemd-zram-generator (systemd-zram-setup@zram0.service). No disk
# swap means no hibernation; S3 suspend is unaffected.
# Half of RAM, at most 8 GiB — the device only takes memory as pages are
# swapped to it, and typical desktop pages compress 2–4×.
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
swap-priority = 100
