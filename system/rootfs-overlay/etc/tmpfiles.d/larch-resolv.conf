# /etc/resolv.conf is a symlink to /run/NetworkManager/resolv.conf (the root is
# read-only, so NetworkManager can't write /etc). Until NetworkManager starts,
# the target doesn't exist and early readers (avahi-daemon) log errors about a
# missing resolv.conf; an empty file is a valid "no nameservers" config, and
# NetworkManager replaces it as soon as it runs.
d /run/NetworkManager 0755 root root -
f /run/NetworkManager/resolv.conf 0644 root root -
