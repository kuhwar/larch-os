# NVIDIA DRM KMS is required for a Wayland session (mutter needs a modeset-
# capable /dev/dri device; without it GNOME falls back to nothing on this
# Wayland-only image). The kernel cmdline carries nvidia-drm.modeset=1 too
# (system/bootloader/entries/*.conf) — this file makes modeset independent of
# the cmdline. fbdev=1: nvidia-drm's own framebuffer console (Plymouth).
options nvidia-drm modeset=1 fbdev=1

# Preserve video memory across suspend: the driver saves VRAM allocations on
# sleep and restores them on wake (driven by the nvidia-suspend/nvidia-resume
# services of xorg-x11-drv-nvidia-580xx-power, enabled in setup-chroot.sh).
# Without this, gnome-shell's GPU state is garbage after resume. The backing
# file goes to NVreg_TemporaryFilePath (default /tmp — tmpfs on larch, i.e.
# RAM; fine for S3 suspend, and hibernate doesn't exist on larch — no swap).
options nvidia NVreg_PreserveVideoMemoryAllocations=1
