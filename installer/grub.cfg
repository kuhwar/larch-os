# grub.cfg — larch-os installer ISO boot menu (UEFI only)
# Show the menu for 3 seconds, then boot the default (installer) entry.
set default=0
set timeout=3
set timeout_style=menu
set gfxpayload=keep

# No vga=/VBE mode: this ISO is UEFI-only, where there is no real-mode VBE for
# the kernel to switch to — vga=0x341 blanks the EFI framebuffer (black screen)
# on firmware that doesn't tolerate it (e.g. OVMF). gfxpayload=keep hands GRUB's
# EFI GOP mode to the kernel, which efifb then uses at native resolution.
menuentry "Install Larch OS" {
    # The installer initramfs carries everything: drivers, firmware, tools and
    # the installer, which downloads the system itself.
    linux  /vmlinuz console=tty0 loglevel=3
    initrd /installer.initramfs
}

# Reboot into the machine's UEFI firmware setup ("BIOS settings").
# fwsetup is provided by GRUB's efifwsetup module (present in the x86_64-efi
# build). Firmware that doesn't support the runtime flag will simply reboot.
menuentry "UEFI Firmware Settings" --id uefi-firmware {
    fwsetup
}
