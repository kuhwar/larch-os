# Hold bluetoothd until the persistent device store is mounted.
#
# The installer adds a bind mount of /etc/larch-conf/bluetooth onto
# /var/lib/bluetooth (LARCHCONF partition, ext4). Without this ordering,
# bluetoothd could start and write pairing keys / device info into the tmpfs
# overlay before the bind mount is ready, losing paired devices on reboot.
# RequiresMountsFor pulls in and orders after that bind mount (and
# transitively the /etc/larch-conf mount).
[Unit]
RequiresMountsFor=/var/lib/bluetooth
