# Hold NetworkManager until the persistent connection store is mounted.
#
# The installer adds a bind mount of /home/<user>/.larch/nm-system-connections
# onto /etc/NetworkManager/system-connections (on the persistent LARCHHOME
# partition). Without this ordering, NetworkManager could start and write
# profiles into the tmpfs overlay before the bind mount is ready, so WiFi
# connections would be lost on reboot. RequiresMountsFor pulls in and orders
# after that mount (and transitively the /home mount).
[Unit]
RequiresMountsFor=/etc/NetworkManager/system-connections
