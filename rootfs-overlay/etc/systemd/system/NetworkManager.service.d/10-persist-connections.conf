# Hold NetworkManager until the persistent connection store is mounted.
#
# The installer adds a bind mount of /etc/larch-conf/nm-system-connections
# onto /etc/NetworkManager/system-connections (LARCHCONF partition, ext4).
# Without this ordering, NetworkManager could start and write profiles into
# the tmpfs overlay before the bind mount is ready, losing WiFi connections
# on reboot. RequiresMountsFor pulls in and orders after that bind mount
# (and transitively the /etc/larch-conf mount).
[Unit]
RequiresMountsFor=/etc/NetworkManager/system-connections
