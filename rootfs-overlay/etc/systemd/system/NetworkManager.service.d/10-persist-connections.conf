# Hold NetworkManager until its persistent stores are mounted.
#
# /etc/fstab bind-mounts /etc/larch-conf/nm-system-connections onto
# /etc/NetworkManager/system-connections (connection profiles) and
# /etc/larch-conf/nm-state onto /var/lib/NetworkManager (Wi-Fi on/off, DHCP
# leases), both on the LARCHCONF partition (ext4). Without this ordering,
# NetworkManager could start and write into the tmpfs overlay before the bind
# mounts are ready, losing WiFi connections on reboot. RequiresMountsFor pulls
# in and orders after those bind mounts (and transitively the /etc/larch-conf
# mount).
[Unit]
RequiresMountsFor=/etc/NetworkManager/system-connections /var/lib/NetworkManager
