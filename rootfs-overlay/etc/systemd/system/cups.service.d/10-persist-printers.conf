# Hold cupsd until the persistent printer-state store is mounted.
#
# The installer adds a bind mount of /etc/larch-conf/cups onto
# /etc/cups/larch-state (LARCHCONF partition, ext4). setup-chroot.sh replaces
# /etc/cups/{printers,classes,subscriptions}.conf and /etc/cups/ppd with
# symlinks into larch-state/, so cupsd reads and writes queue state there.
# Without this ordering, cupsd could start and create those files in the
# tmpfs overlay (through the symlinks, before the bind mount is ready),
# losing configured printers on reboot. RequiresMountsFor pulls in and orders
# after that bind mount (and transitively the /etc/larch-conf mount).
[Unit]
RequiresMountsFor=/etc/cups/larch-state
