# Hold every timer until its stamp store is mounted (applies to all .timer
# units — a unit-type drop-in).
#
# /var/lib/systemd/timers is bind-mounted from /etc/larch-conf/systemd-timers
# (LARCHCONF partition, ext4). Persistent=true timers read their last-run stamp
# from there when they start; a nofail mount isn't ordered before
# local-fs.target, so without this a timer could read (and write) the empty
# tmpfs directory instead and never catch up after downtime.
[Unit]
RequiresMountsFor=/var/lib/systemd/timers
