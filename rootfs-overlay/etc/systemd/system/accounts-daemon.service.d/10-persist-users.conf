# Hold accounts-daemon until its persistent state directory is mounted.
#
# The installer adds a bind mount of /etc/larch-conf/accountsservice onto
# /var/lib/AccountsService (LARCHCONF partition, ext4). That's where the user's
# language (set in GNOME Settings, read by GDM at login) and avatar live.
# Without this ordering, accounts-daemon could start and save them into the
# tmpfs overlay before the bind mount is ready, losing them on reboot.
# RequiresMountsFor pulls in and orders after that bind mount (and
# transitively the /etc/larch-conf mount).
[Unit]
RequiresMountsFor=/var/lib/AccountsService
