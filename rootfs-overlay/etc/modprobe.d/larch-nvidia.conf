# NVIDIA DRM KMS is required for a Wayland session (mutter needs a modeset-
# capable /dev/dri device; without it GNOME falls back to nothing on this
# Wayland-only image). The kernel cmdline carries nvidia-drm.modeset=1 too
# (bootloader/entries/*.conf) — this file makes modeset independent of the
# cmdline. Debian renames the module *file* to nvidia-current-drm.ko (the
# internal module name stays nvidia_drm), and modprobe options match the file
# name being inserted, hence nvidia-current-drm here.
options nvidia-current-drm modeset=1

# Preserve video memory across suspend: the driver saves VRAM allocations on
# sleep and restores them on wake (driven by nvidia-suspend/nvidia-resume
# services from nvidia-suspend-common). Without this, gnome-shell's GPU state
# (glyph atlas, textures) is garbage after resume and the session SIGABRTs.
# The backing file goes to NVreg_TemporaryFilePath (default /tmp — tmpfs on
# larch, i.e. RAM; fine for S3 suspend since RAM stays powered, and hibernate
# doesn't exist on larch anyway — no swap).
options nvidia-current NVreg_PreserveVideoMemoryAllocations=1
