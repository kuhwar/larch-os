# grub.cfg — larch-os live ISO boot menu
set default=0
set timeout=5
set gfxpayload=keep

menuentry "Install Larch OS" {
    linux  /vmlinuz console=tty0 loglevel=3 vga=0x341
    initrd /initramfs.img
}

menuentry "Install Larch OS (debug — verbose boot)" {
    linux  /vmlinuz console=tty0 loglevel=7 vga=0x341
    initrd /initramfs.img
}
