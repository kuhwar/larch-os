# grub.cfg — larch-os live ISO boot menu (UEFI only)
# Show the menu for 3 seconds, then boot the default (installer) entry.
set default=0
set timeout=3
set timeout_style=menu
set gfxpayload=keep

menuentry "Install Larch OS" {
    linux  /vmlinuz console=tty0 loglevel=3 vga=0x341
    initrd /initramfs.img
}

# Reboot into the machine's UEFI firmware setup ("BIOS settings").
# fwsetup is provided by GRUB's efifwsetup module (present in the x86_64-efi
# build). Firmware that doesn't support the runtime flag will simply reboot.
menuentry "UEFI Firmware Settings" --id uefi-firmware {
    fwsetup
}
