# grub.cfg — larch-os live ISO boot menu (UEFI only)
# Show the menu for 3 seconds, then boot the default (installer) entry.
set default=0
set timeout=3
set timeout_style=menu
set gfxpayload=keep

# No vga=/VBE mode: this ISO is UEFI-only, where there is no real-mode VBE for
# the kernel to switch to — vga=0x341 blanks the EFI framebuffer (black screen)
# on firmware that doesn't tolerate it (e.g. OVMF). gfxpayload=keep hands GRUB's
# EFI GOP mode to the kernel, which efifb then uses at native resolution.
menuentry "Install Larch OS" {
    # The ISO boots the real OS image (~600 MB squashfs embedded in the
    # initramfs), which GRUB loads into RAM before the kernel starts — up to a
    # minute from USB. Print a notice first so the wait does not look like a hang.
    echo ""
    echo "Loading larch-os into memory (~600 MB)."
    echo "From a USB stick this can take up to a minute — please wait..."
    # larch.installer                → larch-installer.service runs the installer
    #                                  on tty1 instead of the graphical login.
    # systemd.unit=multi-user.target → boot to a text console (no GDM). udev still
    #                                  loads every driver, so keyboard/disk work on
    #                                  any hardware — which is why the installer no
    #                                  longer needs a hand-rolled module list.
    linux  /vmlinuz console=tty0 loglevel=3 larch.installer systemd.unit=multi-user.target
    initrd /initramfs.img
}

# Reboot into the machine's UEFI firmware setup ("BIOS settings").
# fwsetup is provided by GRUB's efifwsetup module (present in the x86_64-efi
# build). Firmware that doesn't support the runtime flag will simply reboot.
menuentry "UEFI Firmware Settings" --id uefi-firmware {
    fwsetup
}
